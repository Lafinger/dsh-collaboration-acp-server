# Dedicated collaboration OAuth ingress; no panel config or DSH GUI/API includes.
# Bind ONLY the verified LAN address, not 0.0.0.0 or IPv6.
user www-data www-data;
worker_processes 1;
pid /run/dsh-collaboration-login/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 256;
}

http {
    # Required by this server's compiled-in Lua module; no panel scripts are included.
    lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
    default_type text/plain;
    server_tokens off;
    access_log off;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    client_body_temp_path /var/lib/dsh-collaboration-login/client-body 1 2;
    proxy_temp_path /var/lib/dsh-collaboration-login/proxy-temp 1 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:collaboration_login_tls:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    geo $collaboration_login_lan {
        default 0;
        192.168.2.0/24 1;
        127.0.0.1/32 1;
    }

    # Missing/unknown SNI must never reach the OAuth application.
    server {
        listen 192.168.2.20:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 404;
    }

    server {
        listen 192.168.2.20:443 ssl;
        server_name login.lafinger.us.ci;
        ssl_certificate /etc/letsencrypt/live/login.lafinger.us.ci/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/login.lafinger.us.ci/privkey.pem;

        allow 192.168.2.0/24;
        allow 127.0.0.1;
        deny all;

        if ($collaboration_login_lan = 0) { return 403; }
        if ($ssl_server_name != "login.lafinger.us.ci") { return 421; }
        if ($http_host !~* "^login\.lafinger\.us\.ci(:443)?$") { return 421; }

        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

        location ~ "^/collaboration/(login/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}|oauth/callback|login-complete)$" {
            if ($request_method != GET) { return 405; }
            proxy_pass http://127.0.0.1:19481;
            proxy_http_version 1.1;
            proxy_set_header Host login.lafinger.us.ci;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 12s;
            proxy_send_timeout 12s;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_hide_header Cache-Control;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Content-Security-Policy;
        }

        location / { return 404; }
    }
}
