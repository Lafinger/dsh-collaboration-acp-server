# TEMPLATE ONLY: replace domain/certificates/backend port, review and test in isolation.
# Do NOT proxy the DSH UI, /api, /delivery or general management endpoints.
server {
  listen 443 ssl;
  server_name login.example.invalid;
  ssl_certificate /private/reviewed/fullchain.pem;
  ssl_certificate_key /private/reviewed/privkey.pem;
  client_max_body_size 1k;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control no-store always;
  # Callback URL contains a one-use OAuth code: do not put query strings in access logs.
  access_log off;
  location ~ ^/collaboration/(login/[a-f0-9-]{36}|oauth/callback|login-complete)$ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:19481;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
  }
  location / { return 404; }
}
