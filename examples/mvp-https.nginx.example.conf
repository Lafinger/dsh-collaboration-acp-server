# REVIEWED TEMPLATE ONLY, not an automatically applied production configuration.
# Replace example.invalid and private certificate paths after exact deployment/DNS review.
# The complete dedicated nginx config must retain its root service protections and only approved LAN/ZT listeners.
map $http_upgrade $collaboration_upgrade_connection {
    default upgrade;
    '' close;
}
server {
    # Bind ONLY to existing, approved private interfaces; never wildcard/public as a shortcut.
    listen 192.0.2.10:443 ssl; # documentation address, must replace
    server_name example.invalid;
    ssl_certificate /private/cert/fullchain.pem;
    ssl_certificate_key /private/cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/collaboration-mvp-error.log warn;
    client_max_body_size 8k;
    add_header Strict-Transport-Security 'max-age=86400' always;
    # All already-routable approved private LAN/ZeroTier users may attempt official identity login.
    # Configure actual private subnets/interface perimeter here and in firewall; not personal /32 accounts.
    allow 192.0.2.0/24; # documentation range, must replace
    deny all;
    location ^~ /collaboration/ {
        proxy_pass http://127.0.0.1:19483;
        proxy_set_header Host example.invalid;
        proxy_set_header Origin $http_origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $collaboration_upgrade_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }
    location / { return 404; }
}
